<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fdf6ee;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      color: #2d2d2d;
    }

    .container {
      width: 100%;
      max-width: 640px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
    }

    .tag-input-area {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      border: 2px solid #e8e0d8;
      border-radius: 10px;
      min-height: 52px;
      cursor: text;
      transition: border-color 0.2s;
    }

    .tag-input-area:focus-within {
      border-color: #e07b39;
    }

    .tag {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff3eb;
      color: #c05a1a;
      border: 1px solid #f0c9a8;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .tag button {
      background: none;
      border: none;
      cursor: pointer;
      color: #c05a1a;
      font-size: 1rem;
      line-height: 1;
      padding: 0;
      opacity: 0.6;
    }

    .tag button:hover { opacity: 1; }

    #ingredient-input {
      border: none;
      outline: none;
      font-size: 0.95rem;
      background: transparent;
      flex: 1;
      min-width: 120px;
      color: #2d2d2d;
    }

    .hint {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 8px;
    }

    button.primary {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #e07b39;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    button.primary:hover:not(:disabled) { background: #c96a2a; }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .loading {
      text-align: center;
      padding: 32px;
      color: #888;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #f0c9a8;
      border-top-color: #e07b39;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .recipes { display: flex; flex-direction: column; gap: 16px; }

    .recipe-card {
      background: white;
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      border-left: 4px solid #e07b39;
    }

    .recipe-card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #2d2d2d;
    }

    .recipe-card pre {
      font-family: inherit;
      font-size: 0.92rem;
      line-height: 1.65;
      white-space: pre-wrap;
      color: #444;
    }

    .error {
      background: #fff0f0;
      border: 1px solid #f5c6c6;
      border-radius: 10px;
      padding: 16px;
      color: #c0392b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍳 Recipe Agent</h1>
    <p class="subtitle">Tell me what's in your fridge and I'll suggest recipes.</p>

    <div class="card">
      <label for="ingredient-input">Your Ingredients</label>
      <div class="tag-input-area" id="tag-area">
        <input
          id="ingredient-input"
          type="text"
          placeholder="Type an ingredient and press Enter..."
          autocomplete="off"
        />
      </div>
      <p class="hint">Press Enter or comma to add each ingredient.</p>
      <button class="primary" id="submit-btn" disabled>Get Recipe Ideas</button>
    </div>

    <div id="output"></div>
  </div>

  <script>
    const input = document.getElementById("ingredient-input");
    const tagArea = document.getElementById("tag-area");
    const submitBtn = document.getElementById("submit-btn");
    const output = document.getElementById("output");

    let ingredients = [];

    tagArea.addEventListener("click", () => input.focus());

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === ",") {
        e.preventDefault();
        addIngredient(input.value);
      } else if (e.key === "Backspace" && input.value === "" && ingredients.length > 0) {
        removeIngredient(ingredients[ingredients.length - 1]);
      }
    });

    function addIngredient(value) {
      const name = value.trim().replace(/,$/, "");
      if (!name || ingredients.includes(name)) {
        input.value = "";
        return;
      }
      ingredients.push(name);
      input.value = "";
      renderTags();
    }

    function removeIngredient(name) {
      ingredients = ingredients.filter((i) => i !== name);
      renderTags();
    }

    function renderTags() {
      // Remove existing tags
      tagArea.querySelectorAll(".tag").forEach((t) => t.remove());

      ingredients.forEach((name) => {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.innerHTML = `${name} <button aria-label="Remove ${name}">&times;</button>`;
        tag.querySelector("button").addEventListener("click", () => removeIngredient(name));
        tagArea.insertBefore(tag, input);
      });

      submitBtn.disabled = ingredients.length === 0;
    }

    submitBtn.addEventListener("click", async () => {
      output.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>Finding recipes for you...</p>
        </div>`;
      submitBtn.disabled = true;

      try {
        const res = await fetch("/recipes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ingredients }),
        });

        const data = await res.json();

        if (!res.ok) {
          output.innerHTML = `<div class="error">Error: ${data.error}</div>`;
          return;
        }

        output.innerHTML = `<div class="recipes"><div class="recipe-card"><h2>Recipes for: ${ingredients.join(", ")}</h2><pre>${data.recipes}</pre></div></div>`;
      } catch (err) {
        output.innerHTML = `<div class="error">Could not reach the server. Is it running?</div>`;
      } finally {
        submitBtn.disabled = ingredients.length === 0;
      }
    });
  </script>
</body>
</html>
